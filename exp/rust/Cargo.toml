[workspace]
members = ["crates/ss-core", "crates/ss-cli"]
resolver = "2"

[workspace.package]
# Single source of truth for the Rust side, and the shipsmooth-beta release version:
# it names the v<version> tag and the shipsmooth-beta-<version>-<platform>.zip assets.
# An independent series that does NOT track gradle.properties plugin.version; always a
# -beta / -beta.N prerelease so it can never collide with a Java v* tag (plan-115).
version = "0.1.0-beta"
edition = "2021"

# Size-tuned variant measured by the plan-102 footprint spike (Task 6); the
# release profile stays default so the numbers show what tuning buys.
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.37", features = ["serialize"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
thiserror = "2"
regex = "1"
unicode-normalization = "0.1"
serde_json = "1"
toml_edit = { version = "0.22", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
