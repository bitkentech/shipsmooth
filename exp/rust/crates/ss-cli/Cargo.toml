[package]
name = "ss-cli"
version.workspace = true
edition.workspace = true

[features]
experimental = ["ss-core/experimental"]

[[bin]]
# The shipsmooth-beta product's launcher (plan-115). clap's command name stays
# "shipsmooth" so usage/error text matches the Java CLI byte-for-byte (parity).
name = "shipsmooth-beta"
path = "src/main.rs"

[dependencies]
ss-core = { path = "../ss-core" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# Production dependency: ConfigWriter's atomic write (temp file + rename).
tempfile.workspace = true
time.workspace = true
toml_edit.workspace = true
thiserror.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
