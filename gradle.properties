# Make toolchain resolution deterministic on this box: point Gradle at the
# Semeru/OpenJ9 25 install rather than relying on auto-detection alone.
# Auto-download is disabled — the JDK is provisioned locally, not fetched.
org.gradle.java.installations.paths=/opt/installers/jdk-semeru/jdk-25.0.2+10
org.gradle.java.installations.auto-download=false

# Render variant version — must match the Maven project <version> in the root
# pom.xml so rendered output (runtime-<ver> paths, session-start-config) is
# byte-equivalent. Bump this in lockstep with the Maven version.
plugin.version=0.3.16

# Build/render variant flag. Default true = dev build (matches the activeByDefault
# Maven `dev` profile). Prod builds override with -Pexperimental.enabled=false.
experimental.enabled=true
