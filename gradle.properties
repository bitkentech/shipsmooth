# Make toolchain resolution deterministic on this box: point Gradle at the
# Semeru/OpenJ9 25 install rather than relying on auto-detection alone.
# Auto-download is disabled — the JDK is provisioned locally, not fetched.
org.gradle.java.installations.paths=/opt/installers/jdk-semeru/jdk-25.0.2+10
org.gradle.java.installations.auto-download=false

# Plugin/render version — the single source of truth for the build. Stamped into
# rendered output (<ver>/bin paths, session-start-config, manifests). The
# release task (publishRelease) bumps this; nothing else needs to be kept in sync.
plugin.version=0.3.35

# Build variant is selected by -Pbuild.env (plan-75 Task 2): absent = dev (the
# inner loop / devBuild), -Pbuild.env=prod for the release. Every variant property
# (EXPERIMENTAL_BUILD, the jlink image folder) derives from build.env, so there is no
# per-knob experimental.enabled property to keep in sync here.
